[build]
builder = "NIXPACKS"
buildCommand = "npm run prisma:generate && npm run build"

[deploy]
numReplicas = 1
startCommand = "npm run prisma:deploy && npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
healthcheckTimeout = 300

[[deploy.healthcheck]]
httpGet.path = "/health"
httpGet.port = "${{PORT}}"
initialDelaySeconds = 30
periodSeconds = 10
timeoutSeconds = 5
failureThreshold = 3

[environments.production]
NODE_ENV = "production"

[environments.staging]
NODE_ENV = "staging"
